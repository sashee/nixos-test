name: Update flake

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  lock:
    # Update the lock file and publish it as an artifact. Kept small so the two
    # long build jobs below can start in parallel as soon as the lock is ready.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Pin every job in this run to the same main commit; the final push
          # then only fast-forwards if main hasn't moved since.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Update lock file
        run: nix flake update

      - name: Upload updated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error

  checks:
    # Verify every check set against the UPDATED lock, one leg per
    # lib.checkSets entry -- the same matrix ci.yml runs, because this workflow
    # gates an UNREVIEWED auto-commit to main: whatever CI would run on a PR has
    # to run here too, or a nixpkgs bump could land something the next PR then
    # fails on. The rpi5 leg is not redundant with rpi5-x86 either -- it pins the
    # aarch64 vendor kernel and nixos-raspberrypi's own nixpkgs, so it cannot see
    # a bump that breaks hosts/rpi5 against THIS flake's nixpkgs.
    name: checks (${{ matrix.name }})
    needs: lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eval
            system: x86_64-linux
            set: eval
            runner: ubuntu-latest
          - name: anya-feher-laptop
            system: x86_64-linux
            set: anya-feher-laptop
            runner: ubuntu-latest
          - name: rpi5-x86
            system: x86_64-linux
            set: rpi5-x86
            runner: ubuntu-latest
          # Builds the real rpi kernel from source; unlike ci.yml this workflow
          # does not export it as an artifact, so run-checks builds it in place.
          - name: rpi5
            system: aarch64-linux
            set: rpi5
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use updated lock
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: flake-lock
          path: .

      - name: Reclaim disk space
        run: |
          # Delete preinstalled toolchains this repo never uses (~25-30 GB on root).
          # || true so a path missing on the arm64 image is not fatal.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Add swap
        run: |
          swapon --show || true
          sudo fallocate -l 8G /mnt/ci-swapfile
          sudo chmod 600 /mnt/ci-swapfile
          sudo mkswap /mnt/ci-swapfile
          sudo swapon /mnt/ci-swapfile
          swapon --show
          free -h
          df -h

      - name: Run checks (eval+run one check at a time)
        # A single whole-flake eval peaks at ~15 GiB and OOMs the 16 GiB runner;
        # the make target evaluates and runs each check one by one.
        run: make run-checks SYSTEM=${{ matrix.system }} SET=${{ matrix.set }}

  commit:
    # Only reached if every check leg passed -- the same job ci.yml's automerge
    # gates on.
    needs: [checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Same commit the tests ran against (NOT current main). Credentials
        # stay persisted here: this job pushes.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Use updated lock
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: flake-lock
          path: .

      - name: Commit updated lock file
        run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "update flake lock"
          # Non-force push from the tested commit: rejected (non-fast-forward)
          # if main moved during the run, so an untested combination never lands.
          git push origin HEAD:main
