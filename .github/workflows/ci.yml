name: CI

on:
  push:
  pull_request:
    # Defaults plus ready_for_review, so marking a draft PR ready starts a
    # fresh run whose payload has draft=false and can reach the automerge job
    # (a run started while draft keeps draft=true in its frozen payload).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Read-only token by default; only the automerge job elevates.
permissions:
  contents: read

jobs:
  checks:
    # One leg per lib.checkSets entry (see the header there for what each covers),
    # except rpi5, which gets one leg per shard. Each is an independently reported
    # suite whose failures point straight at one config: `eval` at the pure-data
    # and deployed-config assertions, the host sets at that host, `rpi5` at the
    # Pi's real kernel on aarch64. The architecture and the shard split are just
    # more matrix fields -- runs-on takes an expression -- so neither needs its own
    # job. rpi5-x86 finishes in minutes while the rpi5 shards are still compiling
    # the kernel, so a config regression surfaces early; it does NOT replace them
    # (see the header on rpi5X86Checks in flake.nix for what only aarch64 catches).
    #
    # The rpi5 set is sharded because GitHub-hosted arm64 runners (free for public
    # repos) expose no /dev/kvm: its guests run under TCG, 36 checks took 4.5h
    # serially, and the single job hit the 6h limit on its last check. The shards
    # run the same checks at the same CPU share -- nothing runs concurrently within
    # a runner, which would eat into the TCG timing margin the ATTEMPTS retry
    # already covers. Each shard compiles the patched rpi kernel itself (~1.5h; it
    # is in no binary cache); building it once in a preceding job and passing it
    # along as an artifact was measured to save nothing, because the compile is on
    # the critical path either way -- serialized in front of the shards, or in
    # parallel inside them.
    #
    # WHICH checks a shard runs is derived, never listed here: run-checks reads
    # lib.checkSets.rpi5 and takes every n'th name (see the Makefile header), so a
    # check added to the flake lands in a shard with no change to this file. HOW
    # MANY shards there are is the one thing this file states, and `i/n` states it
    # on every line: when resharding, the last number must match the number of
    # rpi5 entries. Getting it too high is the one mistake nothing catches --
    # run-checks rejects i > n, but four entries reading 1/5..4/5 would just drop
    # the fifth shard's checks.
    #
    # The leg label is derived rather than spelled out, so it cannot drift from
    # the fields it describes: `set`, plus the shard when there is one.
    name: checks (${{ matrix.set }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    strategy:
      # Independent legs, as the four separate jobs they replace were: one failing
      # suite must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            set: eval
            runner: ubuntu-latest
          - system: x86_64-linux
            set: anya-feher-laptop
            runner: ubuntu-latest
          - system: x86_64-linux
            set: rpi5-x86
            runner: ubuntu-latest
          - system: aarch64-linux
            set: rpi5
            runner: ubuntu-24.04-arm
            shard: 1/4
          - system: aarch64-linux
            set: rpi5
            runner: ubuntu-24.04-arm
            shard: 2/4
          - system: aarch64-linux
            set: rpi5
            runner: ubuntu-24.04-arm
            shard: 3/4
          - system: aarch64-linux
            set: rpi5
            runner: ubuntu-24.04-arm
            shard: 4/4
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This job builds incoming flake code; don't leave a token in .git.
          persist-credentials: false

      - uses: ./.github/actions/nix-runner

      - name: Run checks (eval+run one check at a time)
        # A single whole-flake eval peaks at ~15 GiB and OOMed the runner; the
        # make target instead evaluates and runs each check strictly one by
        # one, each in its own short-lived nix process.
        #
        # `|| '1/1'` so an unsharded set needs no shard field at all: the whole set
        # is just shard 1 of 1, which is also what a local `make run-*-tests` does.
        run: make run-checks SYSTEM=${{ matrix.system }} SET=${{ matrix.set }} SHARD=${{ matrix.shard || '1/1' }}

      - name: Upload VM artifacts
        # The desktop screenshots, from the host that deploys the desktop.
        if: always() && matrix.set == 'anya-feher-laptop'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plasma-screenshots
          path: |
            results/x86_64-linux/anya-feher-laptop-plasma-firefox/plasma-desktop.png
            results/x86_64-linux/anya-feher-laptop-plasma-firefox/firefox-page.png
          if-no-files-found: warn

  automerge:
    # DIY auto-merge: main has no branch protection (so update-flake.yml can
    # push to it with the plain GITHUB_TOKEN), which also disables GitHub's
    # native auto-merge. `needs` gives the same semantics: this job only runs
    # when every check leg passed. Draft = "don't auto-merge yet": the payload flag
    # below only skips runs that *started* draft, so the merge step re-reads it
    # live (see the frozen-payload note on the triggers above). Owner-only so
    # fork PRs (read-only token anyway) are never merged unreviewed.
    # One entry, but it waits for every matrix leg of that job.
    needs: [checks]
    if: >
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Serialize merges: if several PRs go green at once, they merge one at a
    # time and each later one re-checks main (and correctly fails if it moved).
    concurrency:
      group: automerge
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge PR (only if it matches what CI tested)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          # SHAs the test merge ref was built from. Comparing against them
          # before merging closes the CI-ran-against-stale-code races:
          # BASE_SHA guards main moving under us, --match-head-commit guards
          # a push to the PR branch after tests started (checked atomically
          # by the merge API itself).
          #
          # The two races are not equally bad. A push to the PR branch also
          # starts a fresh CI run whose own automerge does the merge, so this
          # run has nothing left to do: notice + exit 0, no red run, no email.
          # main moving is different -- nothing re-triggers CI for this PR, so
          # it stays a hard error asking for a rebase.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Live PR facts in one call. All three can change after the run was
          # triggered, and the job-level `if` only sees the frozen payload, so
          # draft has to be re-read here or converting a ready PR to draft
          # mid-run would still merge it. Assigned (not `read < <(gh ...)`)
          # because under `bash -e` a failed command substitution aborts the
          # step, while process substitution would swallow an API error into an
          # empty state and read as a skip.
          pr=$(gh pr view "$PR" --repo ${{ github.repository }} \
            --json state,isDraft,headRefOid --jq '[.state, .isDraft, .headRefOid] | @tsv')
          IFS=$'\t' read -r state is_draft current_head <<<"$pr"

          # Everything that means "this run has nothing left to do" comes
          # first, so an intentional draft/close never mails the red
          # main-moved error below.
          if [ "$state" != "OPEN" ]; then
            echo "::notice::skipping automerge: PR #$PR is $state (already handled elsewhere)"
            exit 0
          fi

          if [ "$is_draft" = true ]; then
            echo "::notice::skipping automerge: PR #$PR was converted to draft after CI started; mark it ready for review to re-run CI and merge"
            exit 0
          fi

          # Cheap up-front check for the common case, so the usual path does
          # not depend on GitHub's error wording. --match-head-commit below
          # still covers the narrow window between this check and the merge.
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "::notice::skipping automerge: PR #$PR was pushed after CI started ($HEAD_SHA -> $current_head); the run for the new head will merge it"
            exit 0
          fi

          current_main=$(gh api repos/${{ github.repository }}/branches/main --jq .commit.sha)
          if [ "$current_main" != "$BASE_SHA" ]; then
            echo "::error::main moved since CI ran ($BASE_SHA -> $current_main); update the PR branch to re-run CI against current main"
            exit 1
          fi

          if out=$(gh pr merge "$PR" --rebase --repo ${{ github.repository }} --match-head-commit "$HEAD_SHA" 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"
          if grep -qF 'Head branch was modified' <<<"$out"; then
            echo "::notice::skipping automerge: PR #$PR was pushed after CI started (head no longer $HEAD_SHA); the run for the new head will merge it"
            exit 0
          fi
          # Drafted in the window between the check above and the merge. GitHub
          # refuses to merge drafts, so nothing landed; re-read the flag rather
          # than matching the error text, which is a generic "not mergeable".
          if [ "$(gh pr view "$PR" --repo ${{ github.repository }} --json isDraft --jq .isDraft)" = true ]; then
            echo "::notice::skipping automerge: PR #$PR became a draft while merging; mark it ready for review to re-run CI and merge"
            exit 0
          fi
          exit 1
