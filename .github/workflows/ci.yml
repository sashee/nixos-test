name: CI

on:
  push:
  pull_request:
    # Defaults plus ready_for_review, so marking a draft PR ready starts a
    # fresh run whose payload has draft=false and can reach the automerge job
    # (a run started while draft keeps draft=true in its frozen payload).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Read-only token by default; only the automerge job elevates.
permissions:
  contents: read

jobs:
  rpi-kernel:
    # The patched rpi kernel is in no binary cache, so it compiles from source
    # (~1.5h measured). Its own job because the aarch64 checks are sharded and
    # every shard boots this exact kernel: built once here and handed to the
    # shards as an artifact, it costs 1.5h total instead of 1.5h per shard.
    # The artifact is small (14 MB) -- a kernel output has almost no runtime
    # references, so its closure is the single store path.
    #
    # Deliberately NOT a dependency of the x86 legs: `eval` reports a data drift
    # in about a minute and must not queue behind a kernel compile.
    name: rpi kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This job builds incoming flake code; don't leave a token in .git.
          persist-credentials: false

      - uses: ./.github/actions/nix-runner

      - name: Build + export rpi kernel
        run: make export-rpi-kernel

      - name: Upload rpi kernel cache
        # file:// binary cache of the patched rpi kernel closure. Consumed by the
        # checks-rpi5 shards below, and downloadable for a dev machine: import it
        # with `make import-rpi-kernel CACHE=...` to run the rpi checks locally
        # without the emulated kernel compile.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpi-kernel-cache
          path: rpi-kernel-cache

  checks:
    # One leg per x86 lib.checkSets entry (see the header there for what each
    # covers). Each is an independently reported suite whose failures point
    # straight at one config: `eval` at the pure-data and deployed-config
    # assertions, the host sets at that host. rpi5-x86 finishes in minutes while
    # the aarch64 shards are still going, so a config regression surfaces early;
    # it does NOT replace them (see the header on rpi5X86Checks in flake.nix for
    # what only aarch64 catches). The aarch64 rpi5 set is checks-rpi5 below --
    # it needs the kernel artifact and is sharded, which the x86 legs are not.
    name: checks (${{ matrix.name }})
    strategy:
      # Independent legs, as the separate jobs they replace were: one failing
      # suite must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - name: eval
            system: x86_64-linux
            set: eval
          - name: anya-feher-laptop
            system: x86_64-linux
            set: anya-feher-laptop
          - name: rpi5-x86
            system: x86_64-linux
            set: rpi5-x86
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This job builds incoming flake code; don't leave a token in .git.
          persist-credentials: false

      - uses: ./.github/actions/nix-runner

      - name: Run checks (eval+run one check at a time)
        # A single whole-flake eval peaks at ~15 GiB and OOMed the runner; the
        # make target instead evaluates and runs each check strictly one by
        # one, each in its own short-lived nix process.
        run: make run-checks SYSTEM=${{ matrix.system }} SET=${{ matrix.set }}

      - name: Upload VM artifacts
        # The desktop screenshots, from the host that deploys the desktop.
        if: always() && matrix.name == 'anya-feher-laptop'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plasma-screenshots
          path: |
            results/x86_64-linux/anya-feher-laptop-plasma-firefox/plasma-desktop.png
            results/x86_64-linux/anya-feher-laptop-plasma-firefox/firefox-page.png
          if-no-files-found: warn

  checks-rpi5:
    # lib.checkSets.rpi5 on the Pi's real kernel on aarch64, split across shards.
    # GitHub-hosted arm64 runners (free for public repos) expose no /dev/kvm, so
    # these guests run under TCG: 36 checks took 4.5h serially and the job hit the
    # 6h limit on the last one. The shards are the same checks at the same CPU
    # share, just on more runners -- nothing runs concurrently within a runner,
    # which would eat into the TCG timing margin the ATTEMPTS retry already covers.
    #
    # Which checks a shard runs is derived, not listed: run-checks reads
    # lib.checkSets.rpi5 and takes every SHARDS'th name (see the Makefile header),
    # so a check added to the flake lands in a shard with no change here.
    name: checks (rpi5 ${{ matrix.shard }}/4)
    needs: [rpi-kernel]
    strategy:
      fail-fast: false
      matrix:
        # The only knob: add or remove entries to reshard. SHARDS below reads
        # strategy.job-total, so the count is never written down twice.
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This job builds incoming flake code; don't leave a token in .git.
          persist-credentials: false

      - uses: ./.github/actions/nix-runner

      - name: Download rpi kernel cache
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rpi-kernel-cache
          path: rpi-kernel-cache

      - name: Import rpi kernel
        # Puts the kernel store path in this runner's store so the checks find it
        # built. Evaluates the expected outPath first, so if the kernel drifted
        # from what rpi-kernel built this fails loudly instead of quietly
        # recompiling for 1.5h (or, worse, testing a stale kernel).
        #
        # SUDO= because the runner is already a trusted nix user here (see the
        # target's header); plain `sudo nix` would not resolve on this image.
        run: make import-rpi-kernel CACHE=rpi-kernel-cache SUDO=

      - name: Run checks (eval+run one check at a time)
        run: make run-checks SYSTEM=aarch64-linux SET=rpi5 SHARD=${{ matrix.shard }} SHARDS=${{ strategy.job-total }}

  automerge:
    # DIY auto-merge: main has no branch protection (so update-flake.yml can
    # push to it with the plain GITHUB_TOKEN), which also disables GitHub's
    # native auto-merge. `needs` gives the same semantics: this job only runs
    # when every check leg passed. Draft = "don't auto-merge yet": the payload flag
    # below only skips runs that *started* draft, so the merge step re-reads it
    # live (see the frozen-payload note on the triggers above). Owner-only so
    # fork PRs (read-only token anyway) are never merged unreviewed.
    # Each entry waits for every matrix leg of that job. rpi-kernel is listed
    # even though checks-rpi5 already depends on it: a skipped `needs` skips the
    # dependent, so a kernel failure would stop the merge either way, but naming
    # it keeps "every leg passed" literally true of this list.
    needs: [rpi-kernel, checks, checks-rpi5]
    if: >
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Serialize merges: if several PRs go green at once, they merge one at a
    # time and each later one re-checks main (and correctly fails if it moved).
    concurrency:
      group: automerge
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge PR (only if it matches what CI tested)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          # SHAs the test merge ref was built from. Comparing against them
          # before merging closes the CI-ran-against-stale-code races:
          # BASE_SHA guards main moving under us, --match-head-commit guards
          # a push to the PR branch after tests started (checked atomically
          # by the merge API itself).
          #
          # The two races are not equally bad. A push to the PR branch also
          # starts a fresh CI run whose own automerge does the merge, so this
          # run has nothing left to do: notice + exit 0, no red run, no email.
          # main moving is different -- nothing re-triggers CI for this PR, so
          # it stays a hard error asking for a rebase.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Live PR facts in one call. All three can change after the run was
          # triggered, and the job-level `if` only sees the frozen payload, so
          # draft has to be re-read here or converting a ready PR to draft
          # mid-run would still merge it. Assigned (not `read < <(gh ...)`)
          # because under `bash -e` a failed command substitution aborts the
          # step, while process substitution would swallow an API error into an
          # empty state and read as a skip.
          pr=$(gh pr view "$PR" --repo ${{ github.repository }} \
            --json state,isDraft,headRefOid --jq '[.state, .isDraft, .headRefOid] | @tsv')
          IFS=$'\t' read -r state is_draft current_head <<<"$pr"

          # Everything that means "this run has nothing left to do" comes
          # first, so an intentional draft/close never mails the red
          # main-moved error below.
          if [ "$state" != "OPEN" ]; then
            echo "::notice::skipping automerge: PR #$PR is $state (already handled elsewhere)"
            exit 0
          fi

          if [ "$is_draft" = true ]; then
            echo "::notice::skipping automerge: PR #$PR was converted to draft after CI started; mark it ready for review to re-run CI and merge"
            exit 0
          fi

          # Cheap up-front check for the common case, so the usual path does
          # not depend on GitHub's error wording. --match-head-commit below
          # still covers the narrow window between this check and the merge.
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "::notice::skipping automerge: PR #$PR was pushed after CI started ($HEAD_SHA -> $current_head); the run for the new head will merge it"
            exit 0
          fi

          current_main=$(gh api repos/${{ github.repository }}/branches/main --jq .commit.sha)
          if [ "$current_main" != "$BASE_SHA" ]; then
            echo "::error::main moved since CI ran ($BASE_SHA -> $current_main); update the PR branch to re-run CI against current main"
            exit 1
          fi

          if out=$(gh pr merge "$PR" --rebase --repo ${{ github.repository }} --match-head-commit "$HEAD_SHA" 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"
          if grep -qF 'Head branch was modified' <<<"$out"; then
            echo "::notice::skipping automerge: PR #$PR was pushed after CI started (head no longer $HEAD_SHA); the run for the new head will merge it"
            exit 0
          fi
          # Drafted in the window between the check above and the merge. GitHub
          # refuses to merge drafts, so nothing landed; re-read the flag rather
          # than matching the error text, which is a generic "not mergeable".
          if [ "$(gh pr view "$PR" --repo ${{ github.repository }} --json isDraft --jq .isDraft)" = true ]; then
            echo "::notice::skipping automerge: PR #$PR became a draft while merging; mark it ready for review to re-run CI and merge"
            exit 0
          fi
          exit 1
