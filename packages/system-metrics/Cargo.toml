[package]
name = "system-metrics"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Collect basic host metrics and report them to a local monitoring-platform receiver over its unix socket"

[dependencies]
# The crate the receiver decodes with, but bumped independently of it: nothing pins the two to one
# release. They agree because both generate from the OTLP logs protos, whose stable messages only
# change compatibly, and tests/system-metrics.nix posts through the real receiver to catch the
# day that stops being true.
# `gen-tonic-messages` gives the prost message structs without the gRPC transport;
# `logs` is what unlocks the logs/collector modules (this receiver only takes logs).
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "0.14"
# Safe statvfs and clock_gettime wrappers: AGENTS.md asks for no unsafe blocks, and std has
# neither statvfs nor a way to read CLOCK_MONOTONIC as an absolute value -- which systemd's
# `*Monotonic` unit properties have to be compared against.
rustix = { version = "1", features = ["fs", "time"] }
# Reads flake.lock and smartctl --json. Both are documents this producer takes a handful of
# scalars out of, and neither has a stable enough shape to justify a hand-rolled parser.
serde_json = "1.0.151"

[[bin]]
name = "system-metrics"
path = "src/main.rs"
