[package]
name = "time-correction"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Correct the system clock from an authenticated NTS timestamp, resolving the server over DoH"

[dependencies]
# HTTP for the DoH leg, at whatever version the resolver negotiates over ALPN. Hand-rolling
# HTTP/1.1 would bake in an assumption about the providers that could become false at any time;
# this path runs rarely enough that the dependency weight is the cheaper side of the trade.
# default-features off drops the bundled roots, the proxy support and the codecs -- none of
# which belong in a boot-critical binary. The NTS leg needs no HTTP at all.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "http2"] }
# TLS. The whole design rests on being able to verify a chain at an instant of our choosing,
# which rustls exposes (ServerCertVerifier::verify_server_cert takes `now`) and no other
# client in the ecosystem does. It also exports NTS's keying material from the handshake.
# `ring` rather than the default aws-lc-rs: aws-lc-rs wants cmake/nasm at build time and
# package.nix carries no nativeBuildInputs, while ring builds with the C compiler already in
# stdenv (packages/iroh-ssh depends on iroh's ring backend and builds the same way).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The OS trust store. NOT webpki-roots: VM tests trust their CA through
# security.pki.certificateFiles, which writes /etc/ssl/certs/ca-certificates.crt, and a client
# with compiled-in roots would ignore it and fail every test for the wrong reason.
rustls-native-certs = "0.8"
# notBefore/notAfter, to intersect the chain's validity window. rustls parses certificates
# only inside its verifier, and does not hand the dates back.
x509-parser = "0.18"
# clock_settime. AGENTS.md asks for no unsafe blocks, and std cannot set the clock.
rustix = { version = "1", features = ["time"] }
# AEAD_AES_SIV_CMAC_256, the only algorithm NTS requires a client to implement. RustCrypto,
# but note its own README says no security audit has been performed and constant-time
# operation has not been thoroughly assessed -- worth knowing for a boot-critical path, and
# there is no alternative implementation of this construction in the ecosystem.
# `zeroize` wipes the cipher's copies of the session keys when it is dropped; since 0.8 it is
# opt-in. Default features off drops getrandom: nonces come from /dev/urandom in main.rs.
# `alloc` is for the Vec-returning encrypt.
aes-siv = { version = "0.8", default-features = false, features = ["alloc", "zeroize"] }
# Not used directly: here only to turn on `zeroize` in aes-siv's own dependencies, which its
# feature does not forward. aes-siv's covers only the raw CTR key; the expanded AES key
# schedules (the MAC key's, and the CTR key's per operation) are wiped by aes's, and the CMAC
# chaining state by cmac's. Versions track what aes-siv requires, so features unify;
# package.nix fails evaluation if they stop doing so.
aes = { version = "0.9", features = ["zeroize"] }
cmac = { version = "0.8", features = ["zeroize"] }

[[bin]]
name = "time-correction"
path = "src/main.rs"
