[package]
name = "inverter-monitoring"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Poll a Voltronic-protocol solar inverter over USB serial and report it to a local monitoring-platform receiver"

[dependencies]
# The same crate the receiver decodes with, so the message definitions cannot drift. Identical
# reasoning (and identical features) to packages/system-metrics -- the two producers speak the
# same wire format to the same socket.
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "0.14"
# Safe termios, poll and clock wrappers. AGENTS.md asks for no unsafe blocks, and configuring a
# serial line -- 2400 8N1, raw, no flow control -- is otherwise a tcsetattr(2) call through libc
# that would need one. `ioctl_tiocexcl` is here for the same reason.
#
# `event` is poll(2), which is how the read path tells a quiet line from a disconnected adapter --
# see the comment on `SerialPort::wait`. `pipe` is used only by that module's tests, to produce a
# real hangup on a real fd without an adapter to unplug.
rustix = { version = "1", features = ["event", "fs", "pipe", "termios", "time"] }

[[bin]]
name = "inverter-monitoring"
path = "src/main.rs"
